<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ҳужжатларни сканерлаш</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; font-family: sans-serif;
        }
        #camera-container {
            position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        /* Ақлли тўлиқ экран тўсиғи ва рамка (Албомний формат) */
        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 0 40px rgba(0,0,0,0.7); /* Атрофни тўқлаштириш */
        }
        /* Сиз айтган АЛБОМНИЙ рамка */
        .doc-frame {
            width: 85vw; height: 53vw; /* Пластик карта пропорцияси (85.6мм х 53.98мм) */
            max-width: 340px; max-height: 215px;
            border: 3px solid #00FF00; /* Яшил рамка */
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.7);
            background: transparent;
        }
        .instruction-text {
            color: #fff; text-align: center; margin-bottom: 25px;
            font-size: 14px; font-weight: bold; text-shadow: 2px 2px 6px #000;
            padding: 0 15px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .capture-btn {
            position: absolute; bottom: 30px; width: 75px; height: 75px; 
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%; border: 6px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            cursor: pointer; z-index: 3;
        }
        .capture-btn:active { transform: scale(0.92); background-color: #fff; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline muted></video>
        
        <div class="scanner-overlay">
            <div id="instruction" class="instruction-text">🪪 ПРАВАНИНГ ОЛДИ ТОМОНИНИ АЛБОМНИЙ РАМКАГА ЖОЙЛАШТИРИНГ</div>
            <div class="doc-frame"></div>
        </div>

        <button class="capture-btn" id="capture"></button>
    </div>

    <script src="app.js"></script>
</body>
</html>
