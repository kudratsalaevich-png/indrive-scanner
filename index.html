<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ҳужжатларни сканерлаш</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; font-family: sans-serif;
        }
        #camera-container {
            position: relative; width: 100%; height: 100%;
        }
        video {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* Сиз айтган махсус фото рамка */
        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 0 50px rgba(0,0,0,0.6); /* Атрофни тўқлаштириш */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .doc-frame {
            width: 85%; height: 250px;
            border: 3px solid #00FF00; /* Яшил рамка */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            background: transparent;
        }
        .instruction-text {
            color: #fff; text-align: center; margin-top: 20px;
            font-size: 16px; font-weight: bold; text-shadow: 1px 1px 5px #000;
            padding: 0 20px;
        }
        .capture-btn {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 70px; height: 70px; background-color: #fff;
            border-radius: 50%; border: 5px solid #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .capture-btn:active { background-color: #ccc; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        
        <div class="scanner-overlay">
            <div class="doc-frame"></div>
            <div id="instruction" class="instruction-text">🪪 ПРАВА КАРТОЧКАСИНИНГ ОЛДИ ТОМОНИНИ РАМКАГА ЖОЙЛАШТИРИНГ</div>
        </div>

        <button class="capture-btn" id="capture"></button>
    </div>

    <script src="app.js"></script>
</body>
</html>
